[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/studio"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/explore"
  to = "/explore.html"
  status = 200

[[redirects]]
  from = "/animate"
  to = "/animate.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/plugin"
  to = "/plugin.html"
  status = 200

[[redirects]]
  from = "/gui"
  to = "/gui.html"
  status = 200
