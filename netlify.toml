[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[redirects]]
  from = "/studio"
  to = "/studio.html"
  status = 200

[[redirects]]
  from = "/explore"
  to = "/explore.html"
  status = 200

[[redirects]]
  from = "/b/*"
  to = "/explore.html"
  status = 200

[[redirects]]
  from = "/animate"
  to = "/animate.html"
  status = 200
